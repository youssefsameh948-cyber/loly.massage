<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالتي  ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    position:relative;
}

/* شريط الذكريات الخلفي */
.memory-strip{
    position:absolute;
    top:0;
    right:0;
    width:200%;
    height:100%;
    display:flex;
    gap:15px;
    animation:move 30s linear infinite;
    opacity:.35;
}

.memory-strip img{
    width:260px;
    height:100%;
    object-fit:cover;
    border-radius:25px;
    filter:brightness(.75);
}

@keyframes move{
    0%{transform:translateX(0);}
    100%{transform:translateX(50%);}
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,.8));
    z-index: 1;
}

/* الكارت */
.card{
    position:relative;
    z-index:5;
    width:400px;
    max-height: 90vh;
    overflow-y: auto;
    padding:35px;
    border-radius:30px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    text-align:center;
    color:white;
}

.card::-webkit-scrollbar {
    width: 0px;
}

.heart{
    font-size:65px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.25);}
    100%{transform:scale(1);}
}

h2{
    margin:10px 0;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:15px;
    text-align:center;
    margin-top:10px;
    font-size: 16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:15px;
    background:linear-gradient(135deg,#ff2d55,#ff758f);
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
    font-weight: 600;
}

button:hover{
    transform:scale(1.05);
}

#counter{
    margin-top:15px;
    font-weight:bold;
    font-size: 18px;
}

#message{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,1);
    color:#222;
    line-height:2;
}

#typing{
    min-height:120px;
    white-space: pre-line;
    font-weight: 600;
}

#gallery{
    display:none;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

#gallery img{
    width:100%;
    height:160px;
    object-fit:cover;
    border-radius:15px;
    transition:.4s;
}

#gallery img:hover{
    transform:scale(1.05);
}

/* شاشة المفاجأة النهائية */
#final-screen {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: black;
    color: white;
    font-size: 38px;
    text-align: center;
    padding: 20px;
    z-index: 999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
</style>
</head>

<body>

<div class="memory-strip">
    <img src="img1.jpg.jpg" alt="ذكريات">
    <img src="img2.jpg.jpg" alt="ذكريات">
    <img src="img3.jpg.jpg" alt="ذكريات">
    <img src="img4.jpg.jpg" alt="ذكريات">
    <img src="img5.jpg.jpg" alt="ذكريات">
    <img src="img6.jpg.jpg" alt="ذكريات">
    <img src="img1.jpg.jpg" alt="ذكريات">
    <img src="img2.jpg.jpg" alt="ذكريات">
    <img src="img3.jpg.jpg" alt="ذكريات">
    <img src="img4.jpg.jpg" alt="ذكريات">
    <img src="img5.jpg.jpg" alt="ذكريات">
    <img src="img6.jpg.jpgs" alt="ذكريات">
</div>

<div class="overlay"></div>

<div class="card" id="main-card">
    <div class="heart">❤️</div>
    <h2>رسالتي </h2>
    <input type="password" id="password" placeholder="اكتب كلمة السر">
    <button onclick="showMessage()">فتح الرسالة</button>
    <div id="counter"></div>
    <div id="message">
        <h3 style="color:#ff2d55">🌹 رسالتي  🌹</h3>
        <p id="typing"></p>
        <button onclick="showFinal()">🎁 افتح المفاجأة</button>
    </div>

    <div id="gallery">
        <img src="img10.jpg.jpg" alt="معرض">
        <img src="img20.jpg.jpg" alt="معرض">
        <img src="img30.jpg.jpg" alt="معرض">
        <img src="img5.jpg.jpg" alt="معرض">
    </div>
</div>

<div id="final-screen">
    <div style="font-size:90px; animation:pulse 1.5s infinite;">❤️</div>
    <div>
        بحبك
        <br><br>
        و هفضل أحبك
        <br><br>
        🌹
    </div>
</div>

<script>
const PASSWORD = "8/7/2024";
const START_DATE = "2024-07-08";

// تم كتابة الرسالة بالكامل في سطر واحد مغلق بـ "" واستخدام \n للأسطر لتجنب مشاكل الـ VS Code نهائياً
const LOVE_MESSAGE =  'يلناش غير الصور دي بس اكيد هييجي اليوم اللي هزهق من كتر صورك😂🤝\nكل خروجه وكل مره شوفتك فيها بالنسبالي هي ذكري حلوه عمري مهنساها.\n\nكل ضحكة،\nكل لحظة،\nكل صوره موجودة هنا ليها مكانة كبيرة في قلبي.\n\nهتفضلي انتي أحلي حاجة حصلت في حياتي،\nأغلى شخص عندي.\n\n❤️'

let typingTimeout;

function showMessage(){
    let pass = document.getElementById("password").value;

    if(pass === PASSWORD){
        document.getElementById("message").style.display = "block";
        document.getElementById("gallery").style.display = "grid";
        
        document.getElementById("password").style.display = "none";
        document.querySelector(".card > button").style.display = "none";
        
        startTyping();
        updateCounter();
    } else {
        alert("كلمة السر غير صحيحة");
    }
}

function startTyping(){
    let i = 0;
    let box = document.getElementById("typing");
    box.innerHTML = "";
    clearTimeout(typingTimeout);

    function type(){
        if(i < LOVE_MESSAGE.length){
            box.innerHTML += LOVE_MESSAGE.charAt(i);
            i++;
            typingTimeout = setTimeout(type, 40);
        }
    }
    type();
}

function updateCounter(){
    const start = new Date(START_DATE);
    const now = new Date();
    const diff = now - start;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    document.getElementById("counter").innerHTML = '❤️ مرت 928 {8/7/2024} يوم من احلي الايام حياتي  ❤️'
}

function showFinal(){
    document.getElementById("main-card").style.display = "none";
    document.getElementById("final-screen").style.display = "flex";
}

// توليد القلوب المتطايرة بشكل آمن
setInterval(() => {
    const heart = document.createElement("div");
    heart.innerHTML = "❤️";
    heart.style.position = "fixed";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.bottom = "-50px";
    heart.style.fontSize = (20 + Math.random() * 25) + "px";
    heart.style.zIndex = "1000";
    heart.style.pointerEvents = "none";
    
    document.body.appendChild(heart);

    let pos = -50;
    const fly = setInterval(() => {
        pos += 2;
        heart.style.bottom = pos + "px";
        heart.style.opacity = 1 - (pos / window.innerHeight);

        if(pos > window.innerHeight){
            clearInterval(fly);
            heart.remove();
        }
    }, 20);
}, 700);
</script>

</body>
</html>
